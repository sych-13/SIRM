<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIRMS</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <script defer src="assets/js/core/theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="sidebar-brand" href="#/dashboard">
        <img src="assets/img/logo.svg" alt="SIRMS logo">
        <div><strong>SIRMS</strong><span>Student Records System</span></div>
      </a>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-foot"><div class="sidebar-user" id="sidebarUser"></div></div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-icon btn-soft d-lg-none" id="navToggle" aria-label="Open navigation"><i class="bi bi-list fs-5"></i></button>
        <div class="min-w-0">
          <div class="crumbs"><span id="pageCrumb">Overview</span> · <span id="roleBadge"></span></div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <form class="global-search input-icon" id="globalSearch" role="search">
          <i class="bi bi-search"></i>
          <input class="form-control" name="q" placeholder="Search student no. or name…" aria-label="Search students">
        </form>
        <button class="btn btn-icon theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode"></button>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/core/config.js"></script>
  <script type="module" src="assets/js/core/firebase-init.js"></script>
  <script src="assets/js/data/fixtures.js"></script>
  <script src="assets/js/data/subject-templates.js"></script>
  <script src="assets/js/data/mock-server.js"></script>
  <script src="assets/js/data/firebase-api.js"></script>
  <!-- Core -->
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/core/auth.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/core/router.js"></script>
  <!-- Modules (one file per module) -->
  <script src="assets/js/modules/dashboard-admin.js"></script>
  <script src="assets/js/modules/dashboard-teacher.js"></script>
  <script src="assets/js/modules/student-portal.js"></script>
  <script src="assets/js/modules/students.js"></script>
  <script src="assets/js/modules/enrollment.js"></script>
  <script src="assets/js/modules/subjects.js"></script>
  <script src="assets/js/modules/academic-records.js"></script>
  <script src="assets/js/modules/grades.js"></script>
  <script src="assets/js/modules/search.js"></script>
  <script src="assets/js/modules/reports.js"></script>
  <script src="assets/js/modules/users.js"></script>
  <script src="assets/js/modules/logs.js"></script>
  <script src="assets/js/core/app.js"></script>
</body>
</html>
